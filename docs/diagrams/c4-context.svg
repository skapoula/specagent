<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="580" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">C4 Context Diagram — SpecAgent</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#666666">Level 1: System Context</text>

  <!-- Boundary box: SpecAgent System -->
  <rect x="260" y="160" width="380" height="220" rx="6" fill="none" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="450" y="152" text-anchor="middle" font-size="11" fill="#888888">[System Boundary]</text>

  <!-- Person: Telecom Engineer -->
  <ellipse cx="110" cy="240" rx="28" ry="28" fill="#08427B" stroke="#052e56" stroke-width="1.5"/>
  <line x1="110" y1="268" x2="110" y2="310" stroke="#08427B" stroke-width="2.5"/>
  <line x1="80" y1="285" x2="140" y2="285" stroke="#08427B" stroke-width="2.5"/>
  <line x1="110" y1="310" x2="85" y2="340" stroke="#08427B" stroke-width="2.5"/>
  <line x1="110" y1="310" x2="135" y2="340" stroke="#08427B" stroke-width="2.5"/>
  <text x="110" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Telecom Engineer</text>
  <rect x="50" y="368" width="120" height="32" rx="3" fill="#f0f0f0"/>
  <text x="110" y="380" text-anchor="middle" font-size="10" fill="#444444">Asks questions about</text>
  <text x="110" y="392" text-anchor="middle" font-size="10" fill="#444444">3GPP specifications</text>

  <!-- Person: Developer / App -->
  <ellipse cx="110" cy="460" rx="28" ry="28" fill="#08427B" stroke="#052e56" stroke-width="1.5"/>
  <line x1="110" y1="488" x2="110" y2="530" stroke="#08427B" stroke-width="2.5"/>
  <line x1="80" y1="505" x2="140" y2="505" stroke="#08427B" stroke-width="2.5"/>
  <line x1="110" y1="530" x2="85" y2="555" stroke="#08427B" stroke-width="2.5"/>
  <line x1="110" y1="530" x2="135" y2="555" stroke="#08427B" stroke-width="2.5"/>
  <text x="110" y="574" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Application / Developer</text>
  <!-- label moved, skip second rect -->

  <!-- System: SpecAgent (in scope) -->
  <rect x="300" y="220" width="300" height="100" rx="8" fill="#1168BD" stroke="#0a4d8c" stroke-width="2"/>
  <text x="450" y="256" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">SpecAgent</text>
  <text x="450" y="274" text-anchor="middle" font-size="11" fill="#cce0ff">[Software System]</text>
  <text x="450" y="294" text-anchor="middle" font-size="10" fill="#e8f0ff">Agentic RAG system for answering</text>
  <text x="450" y="308" text-anchor="middle" font-size="10" fill="#e8f0ff">3GPP specification questions</text>

  <!-- External: Groq LLM API -->
  <rect x="660" y="170" width="200" height="80" rx="8" fill="#999999" stroke="#777777" stroke-width="1.5"/>
  <text x="760" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Groq LLM API</text>
  <text x="760" y="220" text-anchor="middle" font-size="11" fill="#eeeeee">[External System]</text>
  <text x="760" y="238" text-anchor="middle" font-size="10" fill="#ffffff">Cloud-hosted LLM inference</text>

  <!-- External: Custom LLM Endpoint (optional) -->
  <rect x="660" y="300" width="200" height="80" rx="8" fill="#999999" stroke="#777777" stroke-width="1.5"/>
  <text x="760" y="333" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Custom LLM Endpoint</text>
  <text x="760" y="350" text-anchor="middle" font-size="11" fill="#eeeeee">[External System]</text>
  <text x="760" y="367" text-anchor="middle" font-size="10" fill="#ffffff">OpenAI-compatible endpoint</text>

  <!-- External: 3GPP Spec Files -->
  <rect x="660" y="430" width="200" height="80" rx="8" fill="#999999" stroke="#777777" stroke-width="1.5"/>
  <text x="760" y="463" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3GPP Spec Files</text>
  <text x="760" y="480" text-anchor="middle" font-size="11" fill="#eeeeee">[External System]</text>
  <text x="760" y="498" text-anchor="middle" font-size="10" fill="#ffffff">PDF, DOCX, HTML spec docs</text>

  <!-- Arrows: Engineer -> SpecAgent -->
  <line x1="138" y1="270" x2="298" y2="255" stroke="#707070" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="168" y="248" width="100" height="22" rx="3" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  <text x="218" y="263" text-anchor="middle" font-size="10" fill="#444444">Asks question [CLI/API]</text>

  <!-- Arrows: SpecAgent -> Engineer (response) -->
  <line x1="298" y1="275" x2="140" y2="290" stroke="#707070" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="163" y="278" width="105" height="22" rx="3" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  <text x="215" y="293" text-anchor="middle" font-size="10" fill="#444444">Returns cited answer</text>

  <!-- Arrows: Developer -> SpecAgent -->
  <line x1="138" y1="470" x2="298" y2="305" stroke="#707070" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="172" y="372" width="92" height="22" rx="3" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  <text x="218" y="387" text-anchor="middle" font-size="10" fill="#444444">POST /query [HTTPS]</text>

  <!-- SpecAgent -> Groq -->
  <line x1="600" y1="245" x2="658" y2="215" stroke="#707070" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="604" y="218" width="52" height="22" rx="3" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  <text x="630" y="233" text-anchor="middle" font-size="9" fill="#444444">LLM calls</text>

  <!-- SpecAgent -> Custom Endpoint -->
  <line x1="600" y1="280" x2="658" y2="335" stroke="#707070" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="600" y="296" width="56" height="22" rx="3" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  <text x="628" y="311" text-anchor="middle" font-size="9" fill="#444444">optional</text>

  <!-- 3GPP Files -> SpecAgent (ingestion) -->
  <line x1="660" y1="460" x2="602" y2="315" stroke="#707070" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="613" y="370" width="60" height="22" rx="3" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  <text x="643" y="385" text-anchor="middle" font-size="9" fill="#444444">Ingested</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#707070"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="20" y="80" width="220" height="68" rx="4" fill="#f8f8f8" stroke="#dddddd" stroke-width="1"/>
  <text x="30" y="97" font-size="11" font-weight="bold" fill="#333333">Legend</text>
  <rect x="30" y="104" width="14" height="14" rx="2" fill="#08427B"/>
  <text x="50" y="115" font-size="10" fill="#444444">Person</text>
  <rect x="30" y="122" width="14" height="14" rx="2" fill="#1168BD"/>
  <text x="50" y="133" font-size="10" fill="#444444">System (in scope)</text>
  <rect x="110" y="122" width="14" height="14" rx="2" fill="#999999"/>
  <text x="130" y="133" font-size="10" fill="#444444">External system</text>
</svg>
